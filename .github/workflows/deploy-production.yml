name: Deploy production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      database_bootstrap_confirmation:
        description: Type BOOTSTRAP_PRODUCTION_DATABASE only for the first database-bound deploy
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  preview-production-migrations:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.database_bootstrap_confirmation == 'BOOTSTRAP_PRODUCTION_DATABASE' && 'production-database-bootstrap' || 'production-preview' }}
    outputs:
      release-sha: ${{ steps.release.outputs.sha }}
      migration-tree: ${{ steps.migrations.outputs.tree }}
      project-ref-hash: ${{ steps.target.outputs.project_ref_hash }}
      project-identity-hash: ${{ steps.project.outputs.project_identity_hash }}
      migration-state-hash: ${{ steps.remote-migrations.outputs.migration_state_hash }}
      target-mode: ${{ steps.target.outputs.database_target_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve the release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release must resolve to one lowercase commit SHA." >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Require a commit already present on main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Require successful staging acceptance for this exact commit
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-staging-evidence.mjs
      - name: Prove the protected production Supabase project identity
        id: project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ORGANIZATION_ID: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
          SUPABASE_PROJECT_NAME: ${{ secrets.SUPABASE_PROJECT_NAME }}
        run: node scripts/verify-supabase-project.mjs >> "$GITHUB_OUTPUT"
      - name: Prove the production database target before migration preview
        id: target
        env:
          FIRELIGHT_BASE_URL: https://firelight.ie
          FIRELIGHT_EXPECTED_ENVIRONMENT: production
          FIRELIGHT_DATABASE_BOOTSTRAP_CONFIRMATION: ${{ inputs.database_bootstrap_confirmation }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/verify-database-target.mjs >> "$GITHUB_OUTPUT"
      - name: Link the production database for preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Fingerprint remote migration history for approval
        id: remote-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/verify-migration-state.mjs >> "$GITHUB_OUTPUT"
      - name: Preview production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push --linked --dry-run
      - name: Record the reviewed migration tree
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_tree="$(git rev-parse HEAD:supabase/migrations)"
          if [[ ! "$migration_tree" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "The migration tree did not resolve to a Git object ID." >&2
            exit 1
          fi
          echo "tree=$migration_tree" >> "$GITHUB_OUTPUT"
          echo "Reviewed migration tree: $migration_tree"
          git ls-tree -r --name-only HEAD supabase/migrations

  apply-and-deploy:
    needs:
      - verify
      - preview-production-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://firelight.ie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.preview-production-migrations.outputs.release-sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind approval to the previewed commit and migration tree
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.preview-production-migrations.outputs.release-sha }}
          EXPECTED_MIGRATION_TREE: ${{ needs.preview-production-migrations.outputs.migration-tree }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD:supabase/migrations)"
          if [[ "$actual_sha" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "The approved release commit changed after preview." >&2
            exit 1
          fi
          if [[ "$actual_tree" != "$EXPECTED_MIGRATION_TREE" ]]; then
            echo "The approved migration tree changed after preview." >&2
            exit 1
          fi
          echo "Applying reviewed migration tree: $actual_tree"
      - run: npm run build
      - name: Read runtime secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler secret list --env production --format json
          > "$RUNNER_TEMP/firelight-worker-secrets.json"
      - name: Verify the complete runtime secret inventory
        run: >-
          node scripts/verify-worker-secrets.mjs
          "$RUNNER_TEMP/firelight-worker-secrets.json"
      - name: Recheck the protected production Supabase project identity
        env:
          FIRELIGHT_EXPECTED_PROJECT_IDENTITY_HASH: ${{ needs.preview-production-migrations.outputs.project-identity-hash }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ORGANIZATION_ID: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
          SUPABASE_PROJECT_NAME: ${{ secrets.SUPABASE_PROJECT_NAME }}
        run: node scripts/verify-supabase-project.mjs
      - name: Recheck the approved production database target
        env:
          FIRELIGHT_BASE_URL: https://firelight.ie
          FIRELIGHT_EXPECTED_ENVIRONMENT: production
          FIRELIGHT_DATABASE_BOOTSTRAP_CONFIRMATION: ${{ inputs.database_bootstrap_confirmation }}
          FIRELIGHT_EXPECTED_PROJECT_REF_HASH: ${{ needs.preview-production-migrations.outputs.project-ref-hash }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/verify-database-target.mjs
      - name: Link the approved production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Require unchanged remote migration history after approval
        env:
          FIRELIGHT_EXPECTED_MIGRATION_STATE_HASH: ${{ needs.preview-production-migrations.outputs.migration-state-hash }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/verify-migration-state.mjs
      - name: Re-preview production migrations after approval
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push --linked --dry-run
      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push --linked
      - name: Deploy the approved production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy --env production --strict
          --var ENVIRONMENT:production
          --var BUILD_ID:${{ needs.preview-production-migrations.outputs.release-sha }}
          --tag "${{ needs.preview-production-migrations.outputs.release-sha }}"
          --message "firelight-release:production:${{ needs.preview-production-migrations.outputs.release-sha }}"
      - name: Verify production identity and compiler dependencies
        env:
          FIRELIGHT_BASE_URL: https://firelight.ie
          FIRELIGHT_EXPECTED_ENVIRONMENT: production
          FIRELIGHT_EXPECTED_BUILD_ID: ${{ needs.preview-production-migrations.outputs.release-sha }}
          FIRELIGHT_EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FIRELIGHT_CANARY_EMAIL: ${{ secrets.FIRELIGHT_CANARY_EMAIL }}
          FIRELIGHT_CANARY_PASSWORD: ${{ secrets.FIRELIGHT_CANARY_PASSWORD }}
        run: node scripts/postdeploy-canary.mjs
      - name: Contract production progress writes to the Worker service path
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/finalize-progress-write-boundary.mjs
      - name: Re-verify production after progress-write contraction
        env:
          FIRELIGHT_BASE_URL: https://firelight.ie
          FIRELIGHT_EXPECTED_ENVIRONMENT: production
          FIRELIGHT_EXPECTED_BUILD_ID: ${{ needs.preview-production-migrations.outputs.release-sha }}
          FIRELIGHT_EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FIRELIGHT_CANARY_EMAIL: ${{ secrets.FIRELIGHT_CANARY_EMAIL }}
          FIRELIGHT_CANARY_PASSWORD: ${{ secrets.FIRELIGHT_CANARY_PASSWORD }}
        run: node scripts/postdeploy-canary.mjs
      - name: Capture the accepted production release tuple
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRELIGHT_RELEASE_ENVIRONMENT: production
          FIRELIGHT_RELEASE_WORKER_NAME: firelight-production
          FIRELIGHT_RELEASE_BUILD_ID: ${{ needs.preview-production-migrations.outputs.release-sha }}
          FIRELIGHT_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/firelight-release-evidence.json
        run: node scripts/release-evidence.mjs
      - name: Preserve accepted production release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firelight-release-evidence-production-${{ needs.preview-production-migrations.outputs.release-sha }}
          path: ${{ runner.temp }}/firelight-release-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

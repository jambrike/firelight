name: Public status probes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-status-probes
  cancel-in-progress: false

jobs:
  probe:
    name: Probe ${{ matrix.expected_environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - expected_environment: staging
            base_url: https://staging.firelight.ie
          - expected_environment: production
            base_url: https://firelight.ie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Require two consecutive public status failures before failing
        env:
          FIRELIGHT_BASE_URL: ${{ matrix.base_url }}
          FIRELIGHT_EXPECTED_ENVIRONMENT: ${{ matrix.expected_environment }}
        run: node scripts/public-status-probe.mjs
